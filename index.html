<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
</head>
<body>
    <header>
        <figure class="logo">
            <img src="./assets/375px-Pokédex_logo(1).png" alt="">
        </figure>
        <figure class="profile-pic">
            <img src="./assets/treinador-de-pokemon.png" alt="">
        </figure>
    </header>

    <section class="hero">
        <div class="hero-texts">
            <h2>Explore o mundo</h2>
            <h1>Pokemon!</h1>
            <p class="header-description">Descubra conheça e explore todos os Pokémons da Pokédex.</p>
        </div>
        <img src="./assets/Banner Pokémon com Pikachu e Poké Bola.png" alt="" class="banner-mobile">
    </section>
    <form>
        <input type="text" class="search-bar" placeholder="Buscar por nome ou número...">
        <img src="./assets/icons/tabler-icon-search.svg" alt="" class="search-icon">
    </form>
    
</body>
</html>
